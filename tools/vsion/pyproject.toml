[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vsion-phone-cli"
version = "0.1.0"
description = "Command-line client for Vsion's Android task API"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
vsion = "vsion_cli:main"

[tool.setuptools]
py-modules = ["vsion_cli"]
packages = ["vsion_desk"]
package-dir = {"" = "scripts"}

[tool.setuptools.package-data]
vsion_desk = ["*.html", "*.css", "*.js", "vsion-logo.png"]

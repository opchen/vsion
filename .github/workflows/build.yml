name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests + APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default includes the legacy "tools" package, which no
          # longer exists in the current SDK repository (sdkmanager fails).
          packages: platform-tools

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --console=plain

      - name: Build debug and perf APKs
        run: ./gradlew :app:assembleDebug :app:assemblePerf --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vsion-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload perf APKs
        uses: actions/upload-artifact@v4
        with:
          name: vsion-perf
          path: app/build/outputs/apk/perf/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/**
            app/build/reports/tests/**
          if-no-files-found: ignore

  integration:
    name: CLI + relay integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Gradle configures :app too, so an Android SDK must be present even
      # though these tests only touch :core.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: tools/relay/go.sum

      # :core:cliTest runs the Kotlin <-> Python CLI contract plus the Python
      # unit tests; :core:relayTest builds the Go relay gateway and exercises
      # the real tunnel. Both are opt-in task in the project (not part of check).
      - name: CLI and relay tests
        run: ./gradlew :core:cliTest :core:relayTest --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: core/build/reports/tests/**
          if-no-files-found: ignore
